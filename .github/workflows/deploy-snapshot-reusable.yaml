name: deploy-snapshot-reusable

on:
  workflow_call:
    inputs:
      java-version:
        description: The Java compiler version
        default: 17
        type: string
    outputs:
      project-version:
        description: The version of the project
        value: ${{ jobs.deploy.outputs.project-version }}
      repository-artifact-name:
        description: Name of the run artifact containing the deployed Maven repository
        value: ${{ jobs.deploy.outputs.repository-artifact-name }}
    secrets:
      NEXUS_USERNAME:
        description: Nexus snapshot repository username for deploying artifacts
        required: true
      NEXUS_PASSWORD:
        description: Nexus snapshot repository password for deploying artifacts
        required: true

# Explicitly drop all permissions inherited from the caller for security.
# Reference: https://docs.github.com/en/actions/sharing-automations/reusing-workflows#access-and-permissions
permissions: { }

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      project-version: ${{ steps.version.outputs.project-version }}
      repository-artifact-name: deploy-snapshot-repository
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}
          cache: maven
          server-id: apache.snapshots.https
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Export version
        id: version
        shell: bash
        run: |
          export PROJECT_VERSION=$(./mvnw \
            --quiet --batch-mode -DforceStdout=true \
            -Dexpression=project.version \
            help:evaluate \
            | tail -n 1)
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_ENV
          # Export version to calling workflow
          echo "project-version=$PROJECT_VERSION" >> $GITHUB_OUTPUT

      - name: Upload to Nexus
        shell: bash
        env:
          # `NEXUS_USERNAME` and `NEXUS_PASSWORD` are used in `~/.m2/settings.xml` created by `setup-java` action
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          ./mvnw \
            --show-version --batch-mode --errors --no-transfer-progress \
            -P deploy

      # `nexus-staging-maven-plugin` gathers the artifacts in this directory before uploading them.
      # `verify-reproducibility-reusable` uses this artifact.
      - name: Upload deployed repository
        uses: actions/upload-artifact@v7
        with:
          name: deploy-snapshot-repository
          path: target/nexus-staging/deferred
          if-no-files-found: error
          retention-days: 1

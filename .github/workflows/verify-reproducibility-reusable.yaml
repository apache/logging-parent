name: verify-reproducibility-reusable

on:
  workflow_call:
    inputs:
      java-version:
        description: The Java compiler version
        default: 17
        type: string
      maven-args:
        description: Additional Maven arguments
        type: string
      nexus-url:
        description: >
          The URL of the reference Nexus repository.
          Exactly one of `nexus-url` and `reference-artifact-name` must be provided.
        type: string
      reference-artifact-name:
        description: >
          Name of a run artifact containing the reference Maven repository.
          Exactly one of `nexus-url` and `reference-artifact-name` must be provided.
        type: string
      runs-on:
        description: The type of runners to use as JSON array
        default: '["ubuntu-latest"]'
        type: string

env:
  MAVEN_ARGS: ${{ inputs.maven-args }}
  # Keep `maven.multiModuleProjectDirectory` a native Windows path under `shell: bash`,
  # See https://github.com/apache/maven/issues/12537 for context.
  MAVEN_BASEDIR: ${{ github.workspace }}

# Explicitly drop all permissions inherited from the caller for security.
# Reference: https://docs.github.com/en/actions/sharing-automations/reusing-workflows#access-and-permissions
permissions: { }

jobs:

  build:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ${{ fromJSON(inputs.runs-on) }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}

      #
      # Generates a cache key prefix to enable partial cache hits.
      # If there's no exact match for the full cache key, any cache with this prefix can be used as a fallback.
      # To avoid unbounded cache growth, the prefix includes the current month,
      # ensuring a new cache is started each month.
      #
      - name: Compute Cache Key Prefix
        shell: bash
        run: |
          date +"CACHE_KEY=verify-reproducibility-%Y-%m" >> $GITHUB_ENV

      #
      # Configures caching for the local Maven repository.
      # Uses a custom cache key to isolate artifacts built in this workflow,
      # preventing reproducibility results from being affected by cached outputs from other workflows.
      #
      - name: Set up Maven Cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: "${{ env.CACHE_KEY }}-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}"
          restore-keys: |
            ${{ env.CACHE_KEY }}-${{ runner.os }}-

      # Contains the exact artifacts deployed by `deploy-snapshot-reusable`.
      - name: Download reference repository
        if: inputs.reference-artifact-name
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.reference-artifact-name }}
          path: ${{ runner.temp }}/reference-repository

      # `clean verify artifact:compare` is required to generate the build reproducibility report.
      # For details, see: https://maven.apache.org/guides/mini/guide-reproducible-builds.html#how-to-test-my-maven-build-reproducibility
      - name: Verify build reproducibility
        shell: bash
        env:
          NEXUS_URL: ${{ inputs.nexus-url }}
          REFERENCE_ARTIFACT_NAME: ${{ inputs.reference-artifact-name }}
        run: |
          if [ -n "$NEXUS_URL" ] && [ -n "$REFERENCE_ARTIFACT_NAME" ]; then
            echo '::error::Provide exactly one of `nexus-url` or `reference-artifact-name`, not both.'
            exit 1
          fi

          echo '::group::Determine reference repository'
          REFERENCE_REPO=""
          # Computes the URI of the local repository, if `reference-artifact-name` was given.
          if [ -n "$REFERENCE_ARTIFACT_NAME" ]; then
            TEMP_DIR="$RUNNER_TEMP"
            # On Windows, convert `D:\a\_temp` to `D:/a/_temp`
            if command -v cygpath > /dev/null; then
              TEMP_DIR=$(cygpath -m "$TEMP_DIR")
            fi
            # Strip the leading `/`, if present, to form a valid `file:///` URL on all platforms
            REFERENCE_REPO="file:///${TEMP_DIR#/}/reference-repository"
          elif [ -n "$NEXUS_URL" ]; then
            REFERENCE_REPO="$NEXUS_URL"
          else
            echo '::error::Either `nexus-url` or `reference-artifact-name` must be provided.'
            exit 1
          fi
          echo "Using reference repository: $REFERENCE_REPO"
          echo '::endgroup::'

          echo '::group::Purge snapshots from the local Maven repository'
          # Snapshot artifacts restored from the GitHub Actions cache shadow the reference repository during resolution,
          # so their presence means the cache was polluted by a previous run.
          if [ -d ~/.m2/repository ]; then
            find ~/.m2/repository -type d -name '*-SNAPSHOT' -prune -print0 | while IFS= read -r -d '' dir; do
              find "$dir" -type f -print0 | while IFS= read -r -d '' file; do
                echo "::warning::Purging stale snapshot file: $file"
              done
              rm -rf "$dir"
            done
          fi
          echo '::endgroup::'

          ./mvnw \
            --show-version --batch-mode --errors --no-transfer-progress \
            -DskipTests=true \
            -Dreference.repo="${REFERENCE_REPO}" \
            clean verify artifact:compare

      # Remove all snapshots from the local Maven repository before it is saved to the GitHub Actions cache,
      # so that the reference artifacts resolved by `artifact:compare` do not contaminate the cache.
      - name: Purge snapshots from Maven cache
        if: always()
        shell: bash
        run: |
          if [ -d ~/.m2/repository ]; then
            find ~/.m2/repository -type d -name '*-SNAPSHOT' -prune -exec rm -rf {} +
          fi

      # Upload reproducibility results if the build fails.
      - name: Upload reproducibility results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reproducibility-${{matrix.os}}-${{github.run_number}}-${{github.run_attempt}}
          path: |
            **/target/bom.xml
            **/target/*.buildcompare
            **/target/*.jar
            **/target/*.zip
            **/target/reference/**

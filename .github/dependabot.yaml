version: 2

updates:

  # region `main` updates

  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: [ "*" ]
    target-branch: "main"
    ignore:
      # 1.8.0 NPEs on the ${revision} CI-friendly version setup: https://github.com/mojohaus/flatten-maven-plugin/issues/523
      - dependency-name: "org.codehaus.mojo:flatten-maven-plugin"
        versions: [ "[1.8,)" ]
      # 2.43.0 and later require JDK 21 to run, whereas downstream projects still build with JDK 17
      - dependency-name: "com.google.errorprone:error_prone_core"
        versions: [ "[2.43,)" ]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: [ "*" ]
    target-branch: "main"

  # endregion

  # region `gha/v0` updates

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: [ "*" ]
    target-branch: "gha/v0"

  # The NPM dependencies shared by all Apache Logging websites are managed on the `gha/v0` branch
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm-updates:
        patterns: [ "*" ]
    target-branch: "gha/v0"
    ignore:
      # 1.x requires Asciidoctor.js 4, which Antora does not support yet: https://gitlab.com/antora/antora/-/work_items/1213
      - dependency-name: "asciidoctor-kroki"
        versions: [ ">=1.0.0" ]

  # endregion
